<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gallery | Student Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#4F46E5,#7C3AED,#06B6D4);
min-height:100vh;
padding:40px;
overflow-x:hidden;
}

/* Doodle Background */

.circle1{
position:absolute;
width:220px;
height:220px;
border:3px dashed rgba(255,255,255,.25);
border-radius:50%;
top:-60px;
left:-60px;
}

.circle2{
position:absolute;
width:180px;
height:180px;
border:3px solid rgba(255,255,255,.20);
border-radius:50%;
bottom:-40px;
right:-40px;
}

.wave{
position:absolute;
width:280px;
height:280px;
border:3px solid rgba(255,255,255,.12);
border-radius:45%;
top:45%;
left:-120px;
transform:rotate(25deg);
}

.container{
max-width:1100px;
margin:auto;
background:rgba(255,255,255,.15);
backdrop-filter:blur(15px);
padding:40px;
border-radius:25px;
color:white;
box-shadow:0 10px 30px rgba(0,0,0,.3);
}

h1{
text-align:center;
font-size:40px;
margin-bottom:10px;
}

p{
text-align:center;
margin-bottom:35px;
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.gallery img{
width:100%;
height:250px;
object-fit:cover;
border-radius:18px;
border:3px solid rgba(255,255,255,.3);
transition:.4s;
cursor:pointer;
}

.gallery img:hover{
transform:scale(1.06);
box-shadow:0 10px 25px rgba(0,0,0,.4);
}

.button{
display:inline-block;
margin-top:35px;
padding:12px 30px;
background:white;
color:#4F46E5;
text-decoration:none;
font-weight:bold;
border-radius:30px;
transition:.3s;
}

.button:hover{
background:#FFE082;
}

</style>

</head>

<body>

<div class="circle1"></div>
<div class="circle2"></div>
<div class="wave"></div>

<div class="container">

<h1>📸 My Gallery</h1>

<p>A collection of memorable moments from my academic journey, events, projects, and achievements.</p>

<div class="gallery">

<img src="pic1.jpg" alt="Photo 1">

<img src="pic2.jpg" alt="Photo 2">

<img src="pic3.jpg" alt="Photo 3">

<img src="pic4.png" alt="Photo 4">

<img src="pic5.png" alt="Photo 5">

<img src="pic6.jpg" alt="Photo 6">

</div>

<center>
<a href="index.html" class="button">⬅ Back to Home</a>
</center>

</div>

</body>
</html>
