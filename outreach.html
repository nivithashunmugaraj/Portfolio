<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#4F46E5,#7C3AED,#06B6D4);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:40px;
overflow:hidden;
}

/* Doodle Background */

.circle1{
position:absolute;
width:220px;
height:220px;
border:3px dashed rgba(255,255,255,.25);
border-radius:50%;
top:-60px;
left:-60px;
}

.circle2{
position:absolute;
width:180px;
height:180px;
border:3px solid rgba(255,255,255,.20);
border-radius:50%;
bottom:-40px;
right:-40px;
}

.wave{
position:absolute;
width:280px;
height:280px;
border:3px solid rgba(255,255,255,.12);
border-radius:45%;
top:45%;
left:-120px;
transform:rotate(25deg);
}

.container{
width:850px;
background:rgba(255,255,255,.15);
backdrop-filter:blur(15px);
padding:40px;
border-radius:25px;
color:white;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.3);
}

h1{
font-size:40px;
margin-bottom:15px;
}

p{
font-size:18px;
margin-bottom:30px;
}

.info{
text-align:left;
margin:25px auto;
max-width:500px;
}

.info p{
margin:15px 0;
font-size:18px;
}

.info i{
width:35px;
color:#FFE082;
font-size:22px;
}

.social{
margin-top:30px;
}

.social a{
display:inline-block;
width:55px;
height:55px;
line-height:55px;
margin:10px;
background:white;
color:#4F46E5;
border-radius:50%;
font-size:24px;
transition:.3s;
text-decoration:none;
}

.social a:hover{
background:#FFE082;
transform:scale(1.1);
}

.button{
display:inline-block;
margin-top:35px;
padding:12px 30px;
background:white;
color:#4F46E5;
text-decoration:none;
font-weight:bold;
border-radius:30px;
transition:.3s;
}

.button:hover{
background:#FFE082;
}

</style>

</head>

<body>

<div class="circle1"></div>
<div class="circle2"></div>
